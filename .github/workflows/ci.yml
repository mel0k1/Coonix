name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  boot-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # pinned: actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm xorriso qemu-system-x86

      - name: build kernel and userland
        run: make -j$(nproc) all

      - name: build iso and disk
        run: make iso disk

      - name: boot test in qemu (TCG)
        run: python3 scripts/ci_test.py

      - name: scheduler priority test
        run: python3 scripts/qnice.py

      - name: demand paging test
        run: python3 scripts/qdpage.py

      - name: network stack test
        run: python3 scripts/qnet.py

      - name: tcp loopback test
        run: python3 scripts/qtcp.py

      - name: dhcp lease test
        run: python3 scripts/qdhcp.py

      - name: dup + sendmsg test
        run: python3 scripts/qmsg.py

      - name: dns resolver test
        run: python3 scripts/qdns.py

      - name: ipv6 loopback test
        run: python3 scripts/qip6.py

      - name: upload serial log
        if: always()
        # pinned: actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: serial-log
          path: /tmp/coonix-ci-serial.log
          if-no-files-found: ignore
